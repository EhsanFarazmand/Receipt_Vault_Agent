[project]
name = "receipt-vault"
version = "0.1.0"
description = "Receipt Vault — an ADK multi-agent that watches return windows, warranties, recalls & price drops and acts before they expire."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Receipt Vault" }]

# ---------------------------------------------------------------------------
# Dependencies are version-bounded (not floating) as a supply-chain / slopsquatting
# defense (course: 7-Pillar Security, Day 4). `uv.lock` pins exact hashes on top of
# these ranges and IS committed to the repo. Never add a package an agent "guessed"
# without verifying it against a known-good registry first.
# ---------------------------------------------------------------------------
dependencies = [
    "google-adk>=1.0.0,<2.0.0",       # Agent Development Kit (multi-agent core)
    "google-genai>=1.0.0,<2.0.0",     # Gemini client used by ADK
    "pydantic>=2.6.0,<3.0.0",         # Typed schemas for tool I/O and action events
    "python-dateutil>=2.9.0,<3.0.0",  # Robust date parsing for return/warranty windows
    "openpyxl>=3.1.0,<4.0.0",         # Exported .xlsx ledger view
    "mcp>=1.0.0,<2.0.0",              # First-party Receipt Vault MCP server (stdio)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
# Convenience entrypoint for the first-party MCP server (see mcp_server/server.py).
receipt-vault-mcp = "mcp_server.server:main"

[tool.setuptools]
# The ADK agent package the runner discovers. `App(name="app")` must match this.
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only deterministic code/contract tests run under pytest. Agent-behavior validation
# lives in `agents-cli eval`, NOT pytest (LLM output is non-deterministic).
addopts = "-q"
